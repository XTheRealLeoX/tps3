<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Calcolatrice Windows</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #e6e6e6;
            margin: 0;
        }
        .calcolatrice {
            background-color: #f3f3f3;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            width: 280px;
        }
        #display {
            width: 100%;
            height: 60px;
            font-size: 30px;
            text-align: right;
            border: none;
            background: transparent;
            margin-bottom: 10px;
            padding-right: 5px;
            box-sizing: border-box;
            font-weight: bold;
        }
        .tastiera {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
        }
        button {
            height: 50px;
            font-size: 18px;
            border: 1px solid #dcdcdc;
            border-radius: 5px;
            background-color: #ffffff;
            cursor: pointer;
        }
        button:hover {
            background-color: #eaeaea;
        }
        .operatore {
            background-color: #f9f9f9;
        }
        .uguale {
            background-color: #0067c0;
            color: white;
            border: none;
        }
        .uguale:hover {
            background-color: #005a9e;
        }
    </style>
</head>
<body>

<div class="calcolatrice">
    <input type="text" id="display" value="0" readonly>
    <div class="tastiera">
        <button class="operatore" onclick="cancellaTutto()">C</button>
        <button class="operatore" onclick="cancellaUltimo()">⌫</button>
        <button class="operatore" onclick="impostaOperatore('/')">÷</button>
        <button class="operatore" onclick="impostaOperatore('*')">×</button>

        <button onclick="aggiungiNumero('7')">7</button>
        <button onclick="aggiungiNumero('8')">8</button>
        <button onclick="aggiungiNumero('9')">9</button>
        <button class="operatore" onclick="impostaOperatore('-')">-</button>

        <button onclick="aggiungiNumero('4')">4</button>
        <button onclick="aggiungiNumero('5')">5</button>
        <button onclick="aggiungiNumero('6')">6</button>
        <button class="operatore" onclick="impostaOperatore('+')">+</button>

        <button onclick="aggiungiNumero('1')">1</button>
        <button onclick="aggiungiNumero('2')">2</button>
        <button onclick="aggiungiNumero('3')">3</button>
        <button class="uguale" style="grid-row: span 2; height: 100%;" onclick="calcola()">=</button>

        <button style="grid-column: span 2;" onclick="aggiungiNumero('0')">0</button>
        <button onclick="aggiungiPunto()">.</button>
    </div>
</div>

<script>
    let display = document.getElementById("display");
    let primoNumero = null;
    let operatoreCorrente = null;
    let resettaDisplay = false;

    function aggiungiNumero(num) {
        if (display.value === "0" || resettaDisplay) {
            display.value = num;
            resettaDisplay = false;
        } else {
            display.value += num;
        }
    }

    function aggiungiPunto() {
        if (resettaDisplay) {
            display.value = "0.";
            resettaDisplay = false;
            return;
        }
        if (!display.value.includes(".")) {
            display.value += ".";
        }
    }

    function impostaOperatore(op) {
        if (operatoreCorrente !== null && !resettaDisplay) {
            calcola();
        }
        primoNumero = parseFloat(display.value);
        operatoreCorrente = op;
        resettaDisplay = true;
    }

    function calcola() {
        if (operatoreCorrente === null || resettaDisplay) return;
        
        let secondoNumero = parseFloat(display.value);
        let risultato = 0;

        switch (operatoreCorrente) {
            case "+":
                risultato = primoNumero + secondoNumero;
                break;
            case "-":
                risultato = primoNumero - secondoNumero;
                break;
            case "*":
                risultato = primoNumero * secondoNumero;
                break;
            case "/":
                risultato = secondoNumero === 0 ? "Errore" : primoNumero / secondoNumero;
                break;
        }

        display.value = risultato;
        operatoreCorrente = null;
        resettaDisplay = true;
    }

    function cancellaTutto() {
        display.value = "0";
        primoNumero = null;
        operatoreCorrente = null;
        resettaDisplay = false;
    }

    function cancellaUltimo() {
        if (display.value.length > 1) {
            display.value = display.value.slice(0, -1);
        } else {
            display.value = "0";
        }
    }
</script>

</body>
</html>
